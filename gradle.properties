# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true
# Allow Gradle to fetch a matching JDK (project builds against Java 17/21, daemon may run on a newer JDK)
org.gradle.java.installations.auto-download=true

# Mod properties
mod.version=1.0.0
mod.group=fr.minestrator
mod.id=minestratorhelper
mod.name=Minestrator Helper

# Mod metadata (overridden per-version in versions/<mc>/gradle.properties)
mod.mc_dep_fabric=[VERSIONED]
mod.mc_dep_neoforge=[VERSIONED]
mod.mc_title=[VERSIONED]
mod.mc_targets=[VERSIONED]

# Loader-agnostic deps
deps.mixin_extras=0.4.1
deps.fabric_loader=0.18.1

# Versioned deps (overridden per-version)
deps.neoforge_loader=[VERSIONED]
deps.fabric_api=[VERSIONED]
deps.architectury_api=[VERSIONED]
