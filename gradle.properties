# Mod version — single source of truth (per-node deps live in versions/<node>/gradle.properties)
mod_version=1.1.0

# Gradle. The build must run on JDK 25 (26.x nodes need it; JDK 25 also compiles
# the 17/21 targets via toolchains + --release). Pass -Dorg.gradle.java.home or set
# org.gradle.java.home to a JDK 25 install.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
