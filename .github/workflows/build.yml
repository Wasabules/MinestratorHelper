name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build all versions and loaders
        run: ./gradlew chiseledBuild --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: minestratorhelper-jars
          path: build/libs/**/*.jar
          if-no-files-found: error
