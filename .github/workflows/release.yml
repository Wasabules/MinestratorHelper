name: Release

# Publishes a GitHub Release with every version × loader jar.
# Trigger by pushing a tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`)
# or manually via the Actions tab (workflow_dispatch), giving the tag name.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDKs 17 + 21 + 25 (Gradle runs on 25 for ModStitch)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build all versions and loaders
        run: ./gradlew chiseledBuild --stacktrace

      - name: Collect distributable jars
        run: |
          mkdir -p release-jars
          find versions -path '*/build/libs/*.jar' ! -name '*-sources.jar' ! -name '*-dev*.jar' -exec cp {} release-jars/ \;
          echo "Collected jars:"
          ls -1 release-jars

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Minestrator Helper ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-jars/*.jar
